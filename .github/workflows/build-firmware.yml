# Manual firmware build for Radxa Cubie A7A / A7Z.
# Trigger from the Actions tab: "Build Firmware" → Run workflow.
# Restricted to repository admins.
#
# OpenClash pulls ruby. Keep CONFIG_RUBY_ENABLE_YJIT unset so the job does
# not host-compile rustc (that currently fails and is far too heavy for CI).

name: Build Firmware

on:
  workflow_dispatch:
    inputs:
      board:
        description: Target board
        required: true
        type: choice
        default: cubie-a7a
        options:
          - cubie-a7a
          - cubie-a7z
      extra_packages:
        description: Extra packages to enable (space-separated CONFIG names without CONFIG_PACKAGE_ prefix)
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: write

concurrency:
  group: firmware-${{ github.event.inputs.board }}
  cancel-in-progress: true

jobs:
  authorize:
    name: Require repository admin
    runs-on: ubuntu-24.04
    steps:
      - name: Check actor permission
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor,
            });
            core.info(`Actor ${context.actor} has '${data.permission}' permission`);
            if (data.permission !== 'admin') {
              core.setFailed(
                'Only repository admins can start this workflow from the Actions page.'
              );
            }

  build:
    name: Build ${{ github.event.inputs.board }}
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BUILD_DIR: /mnt/openwrt
      BOARD: ${{ github.event.inputs.board }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache \
            /opt/google/chrome \
            /usr/lib/jvm \
            /usr/share/swift
          sudo docker image prune --all --force || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev libelf-dev zlib1g-dev \
            python3 python3-setuptools python3-dev python3-pyelftools \
            rsync unzip wget file swig time ccache \
            device-tree-compiler u-boot-tools qemu-utils
          df -h

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Move sources to large disk
        run: |
          sudo mkdir -p "${BUILD_DIR}"
          sudo chown "${USER}:${USER}" "${BUILD_DIR}"
          rsync -a --delete "${GITHUB_WORKSPACE}/" "${BUILD_DIR}/"
          df -h

      - name: Cache downloaded sources
        uses: actions/cache@v4
        with:
          path: ${{ env.BUILD_DIR }}/dl
          key: openwrt-dl-${{ runner.os }}-${{ hashFiles('.github/files/firmware.config', 'feeds.conf.default') }}
          restore-keys: |
            openwrt-dl-${{ runner.os }}-

      - name: Update and install feeds
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          git submodule update --init --recursive
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate .config
        working-directory: ${{ env.BUILD_DIR }}
        env:
          EXTRA_PACKAGES: ${{ github.event.inputs.extra_packages }}
        run: |
          case "${BOARD}" in
            cubie-a7a) DEVICE="radxa_cubie-a7a" ;;
            cubie-a7z) DEVICE="radxa_cubie-a7z" ;;
            *)
              echo "Unknown board: ${BOARD}"
              exit 1
              ;;
          esac

          cp .github/files/firmware.config .config
          printf 'CONFIG_TARGET_allwinner_aiot_DEVICE_%s=y\n' "${DEVICE}" >> .config

          if [ -n "${EXTRA_PACKAGES}" ]; then
            for pkg in ${EXTRA_PACKAGES}; do
              printf 'CONFIG_PACKAGE_%s=y\n' "${pkg}" >> .config
            done
          fi

          make defconfig

          # defconfig can turn YJIT on (default y on aarch64) after ruby is
          # pulled in via OpenClash. Force it off so we do not host-compile rustc.
          if grep -q '^CONFIG_RUBY_ENABLE_YJIT=y' .config; then
            echo 'Disabling CONFIG_RUBY_ENABLE_YJIT (OpenClash only needs ruby YAML)'
          fi
          sed -i '/CONFIG_RUBY_ENABLE_YJIT/d' .config
          echo '# CONFIG_RUBY_ENABLE_YJIT is not set' >> .config
          if grep -q '^CONFIG_RUBY_ENABLE_YJIT=y' .config; then
            echo '::error::failed to disable Ruby YJIT; that would host-compile rustc'
            exit 1
          fi

          grep -q "^CONFIG_TARGET_allwinner_aiot_DEVICE_${DEVICE}=y" .config
          grep -q '^CONFIG_PACKAGE_luci=y' .config
          grep -q '^CONFIG_PACKAGE_luci-app-openclash=y' .config

          echo "----- enabled target / image packages -----"
          grep -E '^CONFIG_(TARGET_allwinner|PACKAGE_luci|PACKAGE_wpad|PACKAGE_kmod-aic|PACKAGE_luci-app-openclash)|RUBY_ENABLE_YJIT' .config || true

      - name: Download sources
        working-directory: ${{ env.BUILD_DIR }}
        run: make -j"$(nproc)" download

      - name: Compile firmware
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          echo "Building with $(nproc) jobs"
          if ! make -j"$(nproc)"; then
            echo "::error::Parallel build failed; retrying with V=s for the failing step"
            make -j1 V=s
          fi

      - name: Collect firmware images
        id: collect
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          dest="${GITHUB_WORKSPACE}/firmware"
          src="bin/targets/allwinner/aiot"
          mkdir -p "${dest}"
          shopt -s nullglob
          images=("${src}"/*.img.gz)
          if [ ${#images[@]} -eq 0 ]; then
            echo "No firmware images found under ${src}"
            ls -la "${src}" || true
            exit 1
          fi
          cp -a "${images[@]}" "${dest}/"
          for extra in "${src}"/*.manifest "${src}/sha256sums" "${src}/config.buildinfo"; do
            [ -e "${extra}" ] && cp -a "${extra}" "${dest}/"
          done
          (cd "${dest}" && sha256sum -- * > SHA256SUMS)
          echo "Files to upload:"
          ls -lh "${dest}"
          echo "artifact=openwrt-${BOARD}-$(date -u +%Y%m%d)-${GITHUB_SHA:0:7}" >> "${GITHUB_OUTPUT}"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.artifact }}
          path: firmware/
          if-no-files-found: error
          retention-days: 30
